# 普通 MPC 循环路点。改完直接重新运行 call_follow_mpc.sh。
# 每条按顺序下发，停留 duration_s 秒后切下一条，末尾回到第一条。
# 只写 left 时右臂钉在当前末端；只写 right 时左臂钉住。两边都写则双臂一起跟。
# 位姿是工具末端在 frame_id 下的绝对位姿。姿态填真实四元数，不要用 (0, 0, 0, 1)。
# 第 1、2、3 条都是当时的 left_arm_ee_link，相对 base_link。
frame_id: base_link
publish_hz: 10.0
timeout: 0.0
position_tolerance: 0.0
orientation_tolerance: 0.0
