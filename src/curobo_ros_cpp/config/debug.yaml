# 仿真 / 真机对着 RViz 调试：可视化 + TrajOpt 下发控制器。MPC 由 /follow_mpc 开关。
curobo_motion_planning_node:
  ros__parameters:
    # --- 机器人 / TrajOpt ---
    robot: lycus.yml                    # cuRobo 机器人 YAML，当前为 lycus.yml
    scene_model: ""                     # 静态障碍 YAML。空表示没有盒子和网格；点云另由 pointcloud_mode 决定
    warmup_iterations: 1                # TrajOpt CUDA graph warmup 次数；0 则启动快、第一次规划慢
    trajopt_prewarm_groups: [left_arm]   # 优先预热的 OPT 规划组；其他组首次请求时完成 CUDA 初始化
    pick_place_ik_prewarm: true         # Action 就绪前预热插补 IK，不需要点云或关节反馈，不下发命令
    pick_place_ik_prewarm_modes: [left_arm] # 优先准备常用臂，其他臂首次抓放时初始化
    pick_place_ik_prewarm_samples: [33] # 常用批次数；65/129 等规格首次使用时初始化
    use_cuda_graph: true                # 是否捕获 CUDA graph；关则调试方便、稳态更慢
    interpolation_dt: 0.02               # 规划结果相邻点的时间间隔，秒。想要点更密就减小
    trajopt_num_seeds: 2                # 并行种子。关节目标各种子相同，1 最快；位姿目标失败多了再调回 4
    trajopt_finetune_attempts: 0        # 先求出一条能走的轨迹后，再尝试缩短时间的次数。0 只求能走
    trajopt_num_iters: 50               # 每轮 L-BFGS 步数，必须是 25 的倍数。障碍里失败再调回 100
    # 直接轨迹优化失败后，选择优先使用的图搜索算法。
    # rrt：从第 2 次尝试起允许 RRT 回退。若尝试用完且仍有候选关节目标，再试一次 PRM。
    # prm：直接轨迹优化的尝试用完后，使用 PRM 回退。
    trajopt_graph_planner: rrt
    trajopt_interpolation_steps: 2      # OPT 内部 B 样条采样密度，1–32；原默认 4，输出间隔由 interpolation_dt 控制
    position_tolerance: 0.005           # 笛卡尔位置成功阈值 (m)，也用于中间笛卡尔路点验收
    orientation_tolerance: 0.05         # 笛卡尔姿态成功阈值 (rad)，也用于中间笛卡尔路点验收
    trajopt_velocity_scale: 0.5         # TrajOpt 下发时把轨迹时间拉长：0.5 ≈ 半速
    mpc_velocity_scale: 1.0             # MPC 下发时把轨迹时间拉长：0.5 ≈ 半速；跟手时建议 1.0，否则每拍只走前半段
    mpc_follow_velocity_scale: 0.425    # 跟随时再乘一次。实际速度 = mpc_velocity_scale × 这个值，下次 /follow_mpc 生效
    execute_trajectory: true            # true：TrajOpt 规划成功后、以及 /follow_mpc 每拍下发 FollowJointTrajectory
    switch_controllers: true            # true：单臂/双臂之间 switch_controller
    execute_prewarm_group: left_arm     # 启动后切到这只单臂并连上手臂、夹爪轨迹服务。空则首次下发时再做
    execute_timeout: 60.0               # 等控制器执行完成的超时 (s)
    joint_states_topic: /joint_states   # 当前关节
    base_frame: base_link               # 规划参考系；PoseStamped.frame_id 空或等于此值则不查 TF
    robot_model_id: ""                  # RViz DisplayTrajectory 的 robot model id；空则用 YAML 名（lycus）
    planned_trajectory_topic: /curobo/planned_trajectory  # TrajOpt 关节轨迹发布
    trajectory_marker_topic: ""         # 末端绿线 MarkerArray；空则为 /{robot}_motion_trajectory

    # --- Pick/独立 Place 默认工件几何：Action 省略时读取；请按实际工件设置 ---
    pick_place_default_object_size: [0.0, 0.0, 0.0] # 米；0 为未配置占位，使用前必须填三个正尺寸

    # 抓放先规划完整轨迹，再跟随 execute_trajectory：debug 下发仿真控制器，deploy 只发布。
    # 统一从 joint_states_topic 读取本体和夹爪初始状态；不创建夹爪专用命令/反馈话题。
    pick_place_timeout: 180.0           # Action.timeout=0 时的整任务超时，含执行等待 (s)
    gripper_wait_time: 1.0             # 闭合/释放完成后的额外稳定等待，秒；0 不额外等待
    keep_tool_z_vertical: true         # true：路点之间尽量让工具 Z 轴竖直。false：不加这个偏好
    pick_place_joint_state_max_age: 1.0 # 抓放开始时，关节反馈超过这么久就失败，秒
    pick_place_cloud_max_age: 2.0       # 点云接收与采集年龄上限（秒），适用于关节、位姿、IK、抓放和 MPC
    joint_plan_cloud_wait_ms: 5000      # 关节规划没有合格点云时的最长等待（毫秒）
    pick_place_path_tolerance: 0.01     # 接近、抬升、撤退的直线最多偏这么远，米
    pick_place_max_placed_objects: 16   # 一次抓放里最多记住多少个已经放下的物体

    # --- 可视化（调试开）---
    visualize_trajectory: true          # true：TrajOpt 绿线、MPC 每拍预测（curobo_mpc，左绿右品红）和 /display_planned_path
    compute_ee_paths: true              # true：TrajOpt 对规划轨迹做 FK 出末端路径（绿线需要它）
    visualize_mesh_obstacles: true      # true：点云体素发到 /curobo/collision_world（TrajOpt / MPC 共用）
    visualize_goal_waypoints: true      # true：笛卡尔和关节角的路点/目标都发到 /curobo/goal_waypoints，规划失败也保留

    # --- 点云碰撞 ---
    pointcloud_mode: "optional"         # off 不订阅点云。optional：位姿和 IK 在尚未收到点云时可用静态场景。required：要求有效点云
    self_filter_mode: "apply"             # off 不区分本体。observe 只画出被判成本体的点，碰撞仍保留它们。apply 才从碰撞里删掉。改完要重启
    self_filter_padding: 0.05           # 网格和碰撞球的额外外扩距离（米）
    self_filter_max_processing_ms: 300.0 # 一帧本体过滤最多花这么久，毫秒。超时后已确认的本体点仍删除，没查完的点留在障碍里
    pointcloud_topic: /all_points       # 点云话题
    pointcloud_collision: mesh         # 抓放和路点规划怎么用点云：mesh 是三角网格，voxel 是距离场。跟随始终用网格
    pointcloud_voxel_dims: [2.0, 2.0, 2.0]      # voxel 时盒子边长 (m)，base_link。mesh 时忽略
    pointcloud_voxel_center: [0.2, 0.0, 1.0]    # voxel 时盒子中心 (m)。盒子外的点当作没有障碍
    pointcloud_pitch: 0.02              # mesh 的体素边长，也是 voxel 格子边长 (m)
    pointcloud_max_points: 40000        # 滤波/下采样后最多保留点数
    pointcloud_min_range: 0.2           # 离相机近于该值的点丢掉，米。filter_pointcloud 为 false 时不使用
    pointcloud_max_range: 3.0           # 离相机远于该值的点丢掉，米。filter_pointcloud 为 false 时不使用
    filter_pointcloud: false            # true 才按上面两个距离删点。体素合并和边界裁剪始终都会做
    # 变到 base_link 后，盒子外的点不进碰撞。范围按肩高 1.24 米、臂长 0.87 米，再向外扩 0.18 米。
    pointcloud_bounds_min: [0.00, -1.15, 0.20]   # xmin, ymin, zmin (m)
    pointcloud_bounds_max: [1.05, 1.15, 1.90]    # xmax, ymax, zmax (m)
    pointcloud_exclude_boxes: " "  # 基座系里整块丢掉的区域。六个数一组：xmin ymin zmin xmax ymax zmax，多组用空格或逗号隔开。这里只有一个空格，等于不丢
    pointcloud_parent_frame: base_link  # 点云变到此系再进规划（应与 base_frame 一致）
    pointcloud_child_frame: auto       # auto 读机器人光学系，未配置或显式留空则用消息 header.frame_id

    # --- MPC（/follow_mpc 期间生效）---
    mpc_prewarm: false                   # false：某只手臂第一次跟随才加载 MPC，第一拍大约多 1.5 秒。true：启动时就按下面的列表加载
    mpc_prewarm_modes: [left_arm, right_arm, both_arms] # mpc_prewarm 为 true 时要加载的规划组。每多一组，启动更慢，也多占显存
    mpc_device: cuda:0                  # MPC 设备
    mpc_optimization_dt: 0.14           # 预测轨迹上相邻控制点的时间，秒。下发给控制器的点更密，间隔还要除以产物里的插值步数
    mpc_num_control_points: 6           # 向前看几个控制点，必须大于 5。越少求解越快、看得越近：6 约 1.4 秒，8 约 1.7 秒，16 约 2.8 秒。改完要重启
    mpc_control_period: 0.10            # 两拍之间至少隔这么久，秒。求解更慢时按实际耗时走，不会被压回这个值
    mpc_target_max_age: 1.0             # MPC 目标接收超时 (s)，超时停止跟随
    mpc_joint_state_max_age: 1.0        # MPC 运动组关节反馈接收超时 (s)
    mpc_warm_start_iters: 50            # 沿用上一拍结果时的迭代次数，必须是 25 的倍数。次数越大越慢
    mpc_cold_start_iters: 100           # 每次跟随的第一拍，以及目标突然变化时的迭代次数，必须是 25 的倍数
    mpc_follow_joint_goal: true         # true：先求一个不碰的关节目标，再让跟随去追它。false：直接追末端位姿
    mpc_run_ik: false                   # false：只追末端位姿。true：再把逆解当成关节吸引点，手臂可能停在半路
    mpc_posture_weight: 5.0             # 在不改变末端目标的关节方向上，把姿态收向 mpc_posture。0 表示不收
    mpc_posture: l                     # 要收向的姿态：l 是预设构型，zero 是各关节 0。运行中可用 ros2 param set 修改
    mpc_target_topic: /curobo/target    # 输入 MpcTarget（左右臂位姿合一条）
    mpc_plan_topic: /curobo/mpc_plan    # 输出 MpcPlan（左右轨迹 + 结果）
    mpc_missing_target_warn_period: 2.0 # 只有一只手有目标时，隔这么久告警一次，秒。缺目标的那只手保持当前末端
    waypoint_joint_tolerance: 0.1       # 保留实机配置项，当前规划节点未读取
